{% extends 'base.html' %}

{% block content %}
<div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-[0_8px_30px_rgba(15,23,42,0.05)] max-w-3xl mx-auto">
    <div class="mb-5">
        <h2 class="text-lg font-semibold text-slate-900">Boshqarma nomini tahrirlash</h2>
        <p class="mt-1 text-sm text-slate-500">Boshqarma nomini o‘zgartiring va saqlang.</p>
    </div>

    <form method="post" novalidate>
        {% csrf_token %}
        <div class="space-y-4">
            {{ form.name.label_tag }}
            {{ form.name }}
            <button type="submit" class="rounded-xl bg-emerald-600 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-700">Saqlash</button>
            <a href="{% url 'department-admins' %}" class="text-slate-500 hover:text-slate-900">Orqaga</a>
        </div>
    </form>
</div>
{% endblock %}
