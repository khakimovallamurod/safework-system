<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafeWork | Kirish</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <style>
        .swal2-popup.swal-toast-small {
            font-size: 0.82rem !important;
            padding: 0.55rem 0.7rem !important;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-100 antialiased">
    <div class="mx-auto flex min-h-screen w-full max-w-xl items-center px-4 py-8">
        <div class="w-full overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-[0_12px_40px_rgba(15,23,42,0.08)]">
            <div class="bg-emerald-600 px-8 py-8 text-center">
                <div class="mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-xl border-2 border-[#ead9a0] bg-[#fffdf3]">
                    <i class="bi bi-shield-check text-2xl text-emerald-700"></i>
                </div>
                <h1 class="text-2xl font-bold text-white">SafeWork System</h1>
                <p class="mt-1 text-sm text-emerald-100">Tizimga kirish uchun ma'lumotlaringizni kiriting</p>
            </div>

            <div class="px-8 py-8">
                {% if form.errors %}
                    <div id="login-error" data-text="Login yoki parol noto'g'ri."></div>
                {% endif %}
                {% if messages %}
                    <div id="django-messages" class="hidden">
                        {% for message in messages %}
                            <div data-tag="{{ message.tags|default:'info' }}" data-text="{{ message|escape }}"></div>
                        {% endfor %}
                    </div>
                {% endif %}

                <form method="post" class="space-y-4">
                    {% csrf_token %}
                    <div>
                        <label class="mb-1.5 block text-sm font-semibold text-slate-700">Login</label>
                        <div class="flex overflow-hidden rounded-xl border border-slate-300 bg-white focus-within:border-emerald-500 focus-within:ring-2 focus-within:ring-emerald-500/20">
                            <span class="grid w-11 place-items-center border-r border-slate-200 text-slate-500"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="w-full border-0 px-3 py-2.5 text-sm text-slate-900 outline-none" placeholder="Foydalanuvchi nomi" required autofocus />
                        </div>
                    </div>
                    <div>
                        <label class="mb-1.5 block text-sm font-semibold text-slate-700">Parol</label>
                        <div class="flex overflow-hidden rounded-xl border border-slate-300 bg-white focus-within:border-emerald-500 focus-within:ring-2 focus-within:ring-emerald-500/20">
                            <span class="grid w-11 place-items-center border-r border-slate-200 text-slate-500"><i class="bi bi-lock"></i></span>
                            <input type="password" id="pw-field" name="password" class="w-full border-0 px-3 py-2.5 text-sm text-slate-900 outline-none" placeholder="Parolni kiriting" required />
                            <button class="grid w-11 place-items-center border-l border-slate-200 text-slate-500 transition hover:bg-slate-50" type="button" onclick="togglePw()">
                                <i id="pw-icon" class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-emerald-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-emerald-700">
                        <i class="bi bi-box-arrow-in-right"></i> Kirish
                    </button>
                </form>
            </div>

            <div class="border-t border-slate-200 px-4 py-3 text-center text-xs text-slate-500">
                © {% now "Y" %} SafeWork System
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    function togglePw() {
        const f = document.getElementById('pw-field');
        const i = document.getElementById('pw-icon');
        if (f.type === 'password') { f.type = 'text'; i.className = 'bi bi-eye-slash'; }
        else { f.type = 'password'; i.className = 'bi bi-eye'; }
    }

    (function () {
        const toast = Swal.mixin({
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 2600,
            timerProgressBar: true,
            customClass: { popup: 'swal-toast-small' }
        });
        const iconMap = { success: 'success', error: 'error', warning: 'warning', info: 'info' };

        const box = document.getElementById('django-messages');
        if (box) box.querySelectorAll('div[data-tag]').forEach(el =>
            toast.fire({ icon: iconMap[el.dataset.tag] || 'info', text: el.dataset.text })
        );

        const err = document.getElementById('login-error');
        if (err) toast.fire({ icon: 'error', text: err.dataset.text });
    })();
</script>
</body>
</html>
