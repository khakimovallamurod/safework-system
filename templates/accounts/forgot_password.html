{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sopline | Parolni tiklash</title>
    <link rel="icon" href="{% static 'images/favicon.ico' %}" sizes="any" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .swal2-popup.swal-toast-small { font-size: 0.82rem !important; padding: 0.55rem 0.7rem !important; }
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.5); }
    </style>
</head>
<body class="min-h-screen relative overflow-hidden bg-slate-900 text-slate-800 antialiased selection:bg-emerald-500 selection:text-white">
    <div class="absolute inset-0 z-0">
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 rounded-full bg-emerald-500/20 blur-3xl"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[30rem] h-[30rem] rounded-full bg-sky-500/20 blur-3xl"></div>
        <img src="{% static 'images/qurilish.jpeg' %}" class="w-full h-full object-cover opacity-10" alt="Background" />
        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-900/80 to-transparent"></div>
    </div>

    <div class="relative z-10 mx-auto flex min-h-screen w-full items-center justify-center px-4 py-8 lg:px-8">
        <div class="w-full max-w-md overflow-hidden rounded-3xl glass-panel shadow-[0_30px_60px_-15px_rgba(0,0,0,0.5)] transition-all hover:shadow-[0_30px_60px_-15px_rgba(16,185,129,0.2)]">
            <div class="px-8 py-10">
                <div class="mb-8 text-center">
                    <a href="{% url 'home' %}" class="inline-block transition-transform hover:scale-105 duration-300">
                        <img src="{% static 'images/sopline-logo2.png' %}" alt="Sopline logo" class="mx-auto mb-6 h-14 w-auto object-contain drop-shadow-md" />
                    </a>
                    <h2 class="mt-2 text-3xl font-extrabold text-slate-900 tracking-tight">Parolni tiklash</h2>
                    <p class="mt-2 text-sm text-slate-500 font-medium">Ro'yxatdan o'tgan telefon raqamingizni kiriting.</p>
                </div>
                
                {% if messages %}
                    <div id="django-messages" class="hidden">
                        {% for message in messages %}
                            <div data-tag="{{ message.tags|default:'info' }}" data-text="{{ message|escape }}"></div>
                        {% endfor %}
                    </div>
                {% endif %}

                <form method="post" class="space-y-5">
                    {% csrf_token %}
                    <div>
                        <label class="mb-2 block text-sm font-bold text-slate-700">Telefon raqam</label>
                        <div class="relative group">
                            <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-sm font-bold text-slate-400 group-focus-within:text-emerald-500 transition-colors">+998</span>
                            <input type="text" name="phone" required autocomplete="tel-national" inputmode="numeric" placeholder="90 123 45 67" class="w-full rounded-xl border-2 border-slate-200 bg-white px-3 py-2.5 pl-14 text-sm font-semibold text-slate-900 outline-none transition h-12 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10">
                        </div>
                    </div>
                    <button type="submit" class="mt-2 group relative inline-flex w-full items-center justify-center gap-2 overflow-hidden rounded-xl bg-gradient-to-r from-emerald-500 to-emerald-600 px-4 py-3.5 text-sm font-bold text-white shadow-lg shadow-emerald-500/30 transition-all hover:scale-[1.02] hover:shadow-emerald-500/40 active:scale-[0.98]">
                        <span class="absolute right-0 -mt-12 h-32 w-8 translate-x-12 rotate-12 bg-white opacity-10 transition-all duration-1000 ease-out group-hover:-translate-x-40"></span>
                        <i class="bi bi-arrow-right-circle text-lg"></i> Davom etish
                    </button>
                </form>
            </div>

            <div class="bg-slate-50/50 px-4 py-4 text-center text-xs font-medium text-slate-500 border-t border-slate-200/60">
                <a href="{% url 'login' %}" class="inline-flex items-center hover:text-emerald-600 transition-colors">
                    <i class="bi bi-arrow-left mr-1"></i> Orqaga qaytish
                </a>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    document.querySelectorAll('input[name="phone"]').forEach(input => {
        const format = () => {
            let digits = input.value.replace(/\D/g, '');
            if (digits.startsWith('998')) digits = digits.slice(3);
            digits = digits.slice(0, 9);
            let formatted = '';
            if (digits.length > 0) formatted += digits.slice(0, 2);
            if (digits.length >= 3) formatted += ' ' + digits.slice(2, 5);
            if (digits.length >= 6) formatted += ' ' + digits.slice(5, 7);
            if (digits.length >= 8) formatted += ' ' + digits.slice(7, 9);
            input.value = formatted.trim();
        };
        input.addEventListener('input', format);
    });

    (function () {
        const toast = Swal.mixin({
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 3000,
            timerProgressBar: true,
            background: '#ffffff',
            color: '#1e293b',
            customClass: { popup: 'swal-toast-small rounded-xl border border-slate-100 shadow-lg' }
        });
        const iconMap = { success: 'success', error: 'error', warning: 'warning', info: 'info' };
        const box = document.getElementById('django-messages');
        if (box) box.querySelectorAll('div[data-tag]').forEach(el =>
            toast.fire({ icon: iconMap[el.dataset.tag] || 'info', text: el.dataset.text })
        );
    })();
</script>
</body>
</html>
