{% extends 'base.html' %}

{% block content %}
<div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-[0_8px_30px_rgba(15,23,42,0.05)]">
    <div class="mb-5 flex flex-wrap items-start justify-between gap-3">
        <div>
            <h2 class="text-lg font-semibold text-slate-900"><i class="bi bi-people mr-2 text-emerald-600"></i>{{ page_title }}</h2>
            <p class="mt-1 text-sm text-slate-500">{% if department %}{{ department.name }} · {% endif %}{{ page_description }}</p>
        </div>
        <a href="{% url 'section-admins' %}" class="inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">
            <i class="bi bi-diagram-2"></i> Bo'limlar
        </a>
    </div>

    {% include 'accounts/includes/employee_guideline_table.html' %}
</div>
{% endblock %}
