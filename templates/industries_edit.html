{% extends 'base.html' %}

{% block content %}
<div class="max-w-xl rounded-2xl border border-slate-200 bg-white p-5 shadow-[0_8px_30px_rgba(15,23,42,0.05)]">
    <h2 class="mb-4 text-lg font-semibold text-slate-900">Soha tahrirlash</h2>
    <form method="post" class="space-y-3">
        {% csrf_token %}
        {{ form.name.label_tag }}
        {{ form.name }}
        <div class="mt-2 flex gap-2">
            <a href="{% url 'industries:list' %}" class="inline-flex rounded-xl border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Ortga</a>
            <button class="inline-flex items-center gap-2 rounded-xl bg-amber-500 px-4 py-2 text-sm font-medium text-white hover:bg-amber-600" type="submit">
                <i class="bi bi-pencil-square"></i> Saqlash
            </button>
        </div>
    </form>
</div>
{% endblock %}
