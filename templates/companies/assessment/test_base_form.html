{% extends 'base.html' %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.js"></script>

<div class="mb-6 flex items-center justify-between">
    <div>
        <h1 class="text-xl font-bold text-slate-900 sm:text-2xl">{{ title }}</h1>
        <p class="mt-1 text-sm text-slate-500">Test bazasiga savol qo'shish yoki tahrirlash</p>
    </div>
    <a href="{% url 'test-base-list' %}" class="inline-flex items-center gap-2 rounded-xl bg-white px-4 py-2 text-sm font-medium text-slate-700 shadow-sm ring-1 ring-inset ring-slate-300 hover:bg-slate-50 transition">
        <i class="bi bi-arrow-left"></i> Ortga
    </a>
</div>

<div class="mx-auto max-w-5xl">
    <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
        <form method="post" class="p-6 sm:p-8">
            {% csrf_token %}
            
            <div class="space-y-6">
                <!-- Savol matni -->
                <div>
                    <label for="text" class="block text-sm font-medium text-slate-900">Savol matni</label>
                    <div class="mt-2">
                        <textarea id="text" name="text" rows="4" class="block w-full rounded-xl border-0 py-2.5 text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 placeholder:text-slate-400 focus:ring-2 focus:ring-inset focus:ring-brand-600 sm:text-sm sm:leading-6">{{ question.text }}</textarea>
                    </div>
                </div>

                <!-- Variantlar -->
                <div class="space-y-4 rounded-xl border border-slate-100 bg-slate-50/50 p-4 sm:p-6">
                    <h3 class="text-sm font-semibold text-slate-900">Variantlar va to'g'ri javob</h3>
                    
                    <div class="grid gap-4 sm:grid-cols-[1fr,auto]">
                        <!-- A variant -->
                        <div>
                            <label for="option_1" class="block text-sm font-medium text-slate-700">A variant</label>
                            <input type="text" id="option_1" name="option_1" value="{{ question.option_1 }}" required class="mt-1 block w-full rounded-lg border-0 py-2 text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 focus:ring-2 focus:ring-inset focus:ring-brand-600 sm:text-sm" />
                        </div>
                        <div class="flex items-end pb-2">
                            <label class="inline-flex items-center gap-2 cursor-pointer">
                                <input type="radio" name="correct_option" value="1" {% if question.correct_option == 1 %}checked{% endif %} required class="h-4 w-4 border-slate-300 text-brand-600 focus:ring-brand-600" />
                                <span class="text-sm font-medium text-slate-700">To'g'ri javob</span>
                            </label>
                        </div>

                        <!-- B variant -->
                        <div>
                            <label for="option_2" class="block text-sm font-medium text-slate-700">B variant</label>
                            <input type="text" id="option_2" name="option_2" value="{{ question.option_2 }}" required class="mt-1 block w-full rounded-lg border-0 py-2 text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 focus:ring-2 focus:ring-inset focus:ring-brand-600 sm:text-sm" />
                        </div>
                        <div class="flex items-end pb-2">
                            <label class="inline-flex items-center gap-2 cursor-pointer">
                                <input type="radio" name="correct_option" value="2" {% if question.correct_option == 2 %}checked{% endif %} required class="h-4 w-4 border-slate-300 text-brand-600 focus:ring-brand-600" />
                                <span class="text-sm font-medium text-slate-700">To'g'ri javob</span>
                            </label>
                        </div>

                        <!-- C variant -->
                        <div>
                            <label for="option_3" class="block text-sm font-medium text-slate-700">C variant</label>
                            <input type="text" id="option_3" name="option_3" value="{{ question.option_3 }}" required class="mt-1 block w-full rounded-lg border-0 py-2 text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 focus:ring-2 focus:ring-inset focus:ring-brand-600 sm:text-sm" />
                        </div>
                        <div class="flex items-end pb-2">
                            <label class="inline-flex items-center gap-2 cursor-pointer">
                                <input type="radio" name="correct_option" value="3" {% if question.correct_option == 3 %}checked{% endif %} required class="h-4 w-4 border-slate-300 text-brand-600 focus:ring-brand-600" />
                                <span class="text-sm font-medium text-slate-700">To'g'ri javob</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-8 flex items-center justify-end gap-3 border-t border-slate-100 pt-6">
                <a href="{% url 'test-base-list' %}" class="rounded-xl px-4 py-2 text-sm font-medium text-slate-600 hover:text-slate-900">
                    Bekor qilish
                </a>
                {% if not question %}
                <button type="submit" name="save_and_add" value="1" class="rounded-xl bg-indigo-50 px-4 py-2 text-sm font-semibold text-indigo-600 hover:bg-indigo-100 transition">
                    Saqlash va yangi qo'shish
                </button>
                {% endif %}
                <button type="submit" class="rounded-xl bg-brand-600 px-6 py-2 text-sm font-semibold text-white shadow-sm hover:bg-brand-500 transition">
                    Saqlash
                </button>
            </div>
        </form>
    </div>
</div>

<script>
$(document).ready(function() {
    $('#text').summernote({
        placeholder: 'Savol matnini kiriting...',
        tabsize: 2,
        height: 200,
        toolbar: [
          ['style', ['style']],
          ['font', ['bold', 'underline', 'italic', 'clear', 'superscript', 'subscript']],
          ['color', ['color']],
          ['para', ['ul', 'ol', 'paragraph']],
          ['table', ['table']],
          ['insert', ['link', 'picture', 'video', 'math']],
          ['view', ['fullscreen', 'codeview', 'help']]
        ]
    });
});
</script>
{% endblock %}
